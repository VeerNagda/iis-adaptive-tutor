# Run everything with:  docker compose up --build
# Frontend: http://localhost:3000    Backend: http://localhost:5242
services:
  server:
    build: ./server/server
    ports:
      - "5242:5242"
    environment:
      # Empty key (or LLM_PROVIDER=Mock) means mock mode: no Gemini quota is used.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LlmProvider: ${LLM_PROVIDER:-Auto}
      # Off by default. See .env.example for the warning.
      AutoIngest: ${AUTO_INGEST:-false}
      # The browser origin that is allowed to call the API (CORS).
      Cors__Origin: http://localhost:3000
    volumes:
      - tutor-data:/data

  web:
    build:
      context: ./adaptive_tutor
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5242
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  tutor-data:
